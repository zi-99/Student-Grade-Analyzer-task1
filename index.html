<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل درجات الطلاب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="analyzer-box">
        <h3>محلل درجات الطلاب</h3>

        <label for="grade1">الدرجة الأولى:</label>
        <input type="number" id="grade1" placeholder="مثال: 85">

        <label for="grade2">الدرجة الثانية:</label>
        <input type="number" id="grade2" placeholder="مثال: 90">

        <label for="grade3">الدرجة الثالثة:</label>
        <input type="number" id="grade3" placeholder="مثال: 75">

        <label for="attendance">نسبة الحضور (%):</label>
        <input type="number" id="attendance" placeholder="مثال: 80">

        <button id="analyzeBtn" type="button">تحليل النتيجة</button>
        <div id="reportBox" class="report"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
